[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skeptical-cio-evals"
version = "0.1.0"
description = "Evals for AI solutions architects: simulated discovery calls with skeptical enterprise buyers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Alcaraz" }]
dependencies = ["anthropic>=0.40", "python-dotenv>=1", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
scio = "scio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scio = ["viewer_template.html", "dashboard_template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
