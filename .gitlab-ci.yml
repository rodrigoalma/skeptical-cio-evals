# GitLab reads this file on every push and runs the jobs below.

# Every job runs in this Docker image: Python 3.12 with uv preinstalled.
default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  # Runs before each job's script. --locked fails if uv.lock is out of date.
  before_script:
    - uv sync --locked

# Keep uv's download cache between pipelines so installs are fast.
# The cache key changes whenever uv.lock changes.
variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy
cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache]

# Stages run in order; jobs in the same stage run in parallel.
stages: [check]

lint:
  stage: check
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: check
  script:
    - uv run pytest
