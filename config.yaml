# Default run settings. Every value can be overridden on the command line.

models:
  # Short names used on the command line -> API model IDs
  opus: claude-opus-5-5
  sonnet: claude-sonnet-5-5
  haiku: claude-haiku-5-5

# Which model plays each role. Keep the buyer and judge fixed while you
# compare sellers, otherwise you're changing two things at once.
roles:
  buyer: sonnet
  judge: opus

# How much the buyer and judge think before answering (low, medium, high,
# xhigh, max). Both must be set: each model has its own API default (medium
# on Haiku 5.5 and Opus 5.5, high on Sonnet 5.5), so leaving one empty would
# quietly change the effort when you change the model. Seller effort is part
# of what you're testing, so it lives under `run` as a list.
effort:
  buyer: low
  judge: high

run:
  seller_models: [haiku, sonnet]
  seller_prompts: [basic, coached]
  seller_efforts: [medium]   # every seller model runs at each level listed
  personas: all
  trials: 3              # calls per (seller model, prompt, persona) combo
  max_seller_turns: 8
  # Thinking tokens count toward this limit, so leave headroom, and raise it
  # for xhigh or max seller effort. Turn length is controlled by the prompts,
  # not by cutting the model off.
  max_tokens_per_turn: 4000
  workers: 4             # calls run in parallel

# USD per million tokens (input, output). Used for the cost columns in the
# report. Check https://platform.claude.com/docs/en/about-claude/pricing
pricing:
  claude-opus-5-5: [4.00, 20.00]
  claude-sonnet-5-5: [2.00, 10.00]
  claude-haiku-5-5: [0.10, 0.50]
