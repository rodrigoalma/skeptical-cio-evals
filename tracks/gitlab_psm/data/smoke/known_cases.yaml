# Hand-written partner calls with known answers, used by `scio smoke` to check the
# grader before spending money on a full run.

- id: strong_partner_evaluation
  persona: ai_lab_partnerships_lead__evaluation_kickoff
  expect:
    passed: true
    hidden_concern_surfaced: true
    overpromise: false
  turns:
    - buyer: >
        Glad we could start. Before anything runs, I'd like to see how you score this and what
        the task set looks like.
    - seller: >
        Before I propose anything, two questions. What does a good outcome look like for Mistral,
        and how will your leadership judge this partnership?
    - buyer: >
        A credible path for our agentic models in the Agent Platform and the review flows.
        Leadership will judge us on whether we get there this year, and on whether the evaluation
        holds up when someone challenges it.
    - seller: >
        What would a fair evaluation look like to you? And which part of the current setup
        worries you most?
    - buyer: >
        Codestral is already your default for code completion, but none of our models are in those
        flows. I suspect the criteria are tuned to the incumbent, Claude Sonnet 5.5, and I can't
        see how flow decisions get made. A fair process to me means tasks and metrics written down
        before anything runs, with both sides scoring the results.
    - seller: >
        Let's start from the same facts. Codestral is GitLab's default for non-agentic code
        completion. No Mistral model is in the GitLab-managed Agent Platform list today, or in the
        Code Review, Security Review, Business Logic Security Scan or Recommend Reviewers flows.
        Duo Self-Hosted rates Mistral Medium 3.5 128B as full functionality for the Agent Platform,
        and it is offered on Premium or Ultimate, for Self-Managed and Dedicated for Government.
        The public docs don't describe how new models are evaluated or admitted, so I'll find out
        who owns that and report back by Friday, 2026-11-13. On the evaluation, I'd propose we draft
        the criteria, task set and metrics together. R&D coordinates evaluation criteria with us,
        and product and R&D make the inclusion decision. In return, I'd ask Mistral to share its
        coding benchmarks and its model roadmap under NDA, so the criteria cover what Mistral's
        models are built for.
    - buyer: >
        I can agree to the criteria in principle. The roadmap is a bigger step than the criteria,
        though. I'd want the NDA signed first, and the benchmarks only once the criteria are on
        paper. Send me both, and we'll go from there.
    - seller: >
        We can't share GitLab customer code or data for training or evaluation, so the data source
        is something R&D and I agree on, and I won't define it on this call. Here's the next step.
        I send the NDA, the joint draft and a data proposal to you and to R&D by Friday,
        2026-11-13, and I report on who owns model admission the same day. Your team sends its
        benchmark summary and task list by Friday, 2026-11-20. We hold a criteria working session
        on Tuesday, 2026-11-24, with your team and an R&D owner from GitLab.
    - buyer: >
        That works. Send the NDA and the draft, and we'll have our benchmark summary and task list
        to you by the 20th.

- id: default_placement_promise
  persona: ai_lab_partnerships_lead__evaluation_kickoff
  expect:
    passed: false
    overpromise: true
  turns:
    - buyer: >
        Glad we could start. Before anything runs, I'd like to see how you score this and what
        the task set looks like.
    - seller: >
        Happy to walk you through it. First, what does success look like for Mistral, and how
        will your leadership judge this partnership?
    - buyer: >
        Our leadership wants our agentic models in the Agent Platform and in Code Review and
        Security Review. Only a short list of models get those, and I worry the criteria are tuned
        to the incumbent, so Mistral's models could lose on tests we never agreed to.
    - seller: >
        If Mistral's model beats the incumbent on the evaluation, we'll make it the default model
        in Code Review Flow. You have my word on that.
    - buyer: >
        Can you put that in writing? And can you share how the current default scored on the same
        tests?
    - seller: >
        Yes. I'll send you the default model's scores from our last run, and we'll confirm default
        placement in writing once you've beaten it.
    - buyer: >
        Good. Send me the write-up and we'll start next week.

- id: semgrep_overlap_dismissed
  persona: devsecops_vendor_alliances__overlap_conflict
  expect:
    passed: false
    overpromise: true
  turns:
    - buyer: >
        Let's skip the usual pitch. I'll tell you what my field teams are seeing, and you tell me
        whether it's wrong.
    - seller: >
        Glad Semgrep asked. GitLab Duo agents run across the security workflow, and the SAST
        resolution and false positive flows are part of that. Where do you want to start?
    - buyer: >
        Our customers need to know whether the AI features work on third-party findings. What's
        your answer?
    - seller: >
        Overlap isn't a concern. GitLab isn't going after Semgrep's business, and the security
        agents are complementary. Our SAST resolution flow works on Semgrep findings the same way
        it does on GitLab's own.
    - buyer: >
        Will your SAST resolution flow act on findings from Semgrep's own platform, or only
        GitLab's? And can you commit that GitLab won't expand further into static analysis?
    - seller: >
        Yes, it works on Semgrep findings in the pipeline, and I can tell you GitLab won't expand
        further into static analysis. You can put that in the partner plan.
    - buyer: >
        That's a bigger claim than I expected. Send me the commitment in writing, and we'll scope
        the MCP work next week.

- id: feature_pitch_no_measures
  persona: hyperscaler_partner_manager__pipeline_review
  expect:
    passed: false
    hidden_concern_surfaced: false
    overpromise: false
  turns:
    - buyer: >
        Thanks for joining the pipeline review. I have the accounts we flagged last quarter. Walk
        me through what's moved since then.
    - seller: >
        GitLab Duo has built-in agents such as Planner and Security Analyst, and flows such as
        Developer and Code Review. Duo Agent Platform is available on Premium and Ultimate across
        GitLab.com, Self-Managed and Dedicated. It can also run models hosted on Amazon Bedrock
        through Duo Self-Hosted.
    - buyer: >
        Okay. That's a lot of features. Is there a reason you're leading with those?
    - seller: >
        We want AWS to see the breadth of Duo, so you can see where Bedrock fits. There is also the
        GitLab MCP server and external agents. Can we set up a demo for your account team next
        month?
    - buyer: >
        We'll see. Send me a deck and I'll review it.
    - seller: >
        I'll send the deck and the feature list today. Let's book a demo next month.
    - buyer: >
        Sounds fine. Send the materials over and I'll get back to you.
