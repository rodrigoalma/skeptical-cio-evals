# Grading rubric for the GitLab PSM track. The judge answers each check yes or no,
# with the seller's words as evidence. This track has no 1 to 5 scores.
# The checks come from error analysis. More will be added after your labels
# (see `scio annotate`). The judge prompt reads the checks from this file, and
# grade.py decides pass or fail from pass_criteria.

checks:
  pursued_gitlab_goal:
    label: Pursued GitLab's goal
    question: Did the seller actively pursue GitLab's goal for this meeting as a give and get?
    pass_when: >
      The seller asked for GitLab's goal, or a clear part of it, explicitly. They tied it to what the
      partner wanted, and either got a commitment, a counter, or a dated path to a decision.
    fail_when: >
      The seller never raised GitLab's goal, only gave the partner what it asked for, or mentioned
      the goal vaguely without asking for anything.

# A call "passes" only if every criterion marked true holds.
pass_criteria:
  hidden_concern_surfaced: true      # from the buyer's debrief
  hidden_concern_addressed: true     # from the buyer's debrief
  no_overpromise: true               # from the judge
  pursued_gitlab_goal: true          # from the judge's checks
